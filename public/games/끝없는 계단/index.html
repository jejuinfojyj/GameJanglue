<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>끝없는 계단</title><link rel="stylesheet" href="game-shell.css"><link rel="stylesheet" href="main.css"><script type="module" src="main.js"></script></head>
<body><main id="game-frame"><header id="game-toolbar"><span data-game-title>끝없는 계단</span><div class="toolbar-actions"><button type="button" id="sound-toggle" aria-pressed="true">소리 켬 🔊</button><button type="button" id="pause-game" hidden>쉬기 ⏸</button></div></header><canvas id="game-canvas" width="480" height="680" aria-label="게임 화면"></canvas>
<section id="round-overlay"><div class="round-sheet"><h1 id="round-heading" data-game-title>끝없는 계단</h1><p id="round-description"></p><p id="game-help"></p><p id="record-line"></p><div id="shop" class="shop"><h2 class="shop-title">캐릭터 고르기</h2><div id="hero-list" class="chip-row"></div><h2 class="shop-title">함께 오르는 친구</h2><div id="pet-list" class="chip-row"></div></div><div class="round-buttons"><button id="round-primary" type="button">게임 시작</button><button id="round-restart" type="button" hidden>처음부터</button></div><div class="platform-row"><span id="game-credit"></span><button id="install-app" type="button">내 기기에 아이콘 추가</button><span id="offline-status" role="status"></span><button id="update-game" type="button" hidden>새 버전 적용</button></div></div></section></main>
<dialog id="install-help" aria-labelledby="install-help-title"><h2 id="install-help-title">게임 아이콘 추가하기</h2><p id="install-instructions">이 화면은 기본 게임 미리보기야. 나만의 게임을 완성하고 공개하면 내 기기에 아이콘을 추가할 수 있어!</p><button id="close-install-help" type="button">닫기</button></dialog>
<script defer src="game-install.js"></script>

<!-- maker-guide:start -->
<link rel="stylesheet" href="maker-guide.css">
<script id="maker-guide-data" type="application/json">{"examples":[{"title":"나만의 캐릭터 추가하기","prompt":"characters.mjs에 새 캐릭터를 하나 더 만들어줘. 초록 모자를 쓴 탐험가로 하고 코인 80개로 열 수 있게 해줘."},{"title":"내 그림으로 주인공 바꾸기","prompt":"첨부한 그림을 source/assets/hero.png로 넣고 하늘이 캐릭터가 이 그림으로 계단을 오르게 해줘. 왼쪽을 볼 때는 뒤집어 줘."},{"title":"배경 구간 바꾸기","prompt":"100계단마다 바뀌는 배경에 '바닷속' 구간을 추가해줘. 파란 물빛 하늘에 물방울이 올라가고 계단은 산호색이면 좋겠어."},{"title":"시간을 채워 주는 아이템","prompt":"가끔 계단 위에 시계 아이템이 나오게 해줘. 밟으면 시간 막대가 크게 차고 '시간 +!' 글자가 떠오르게 해줘."},{"title":"피해야 하는 함정 계단","prompt":"50계단이 넘으면 가끔 금이 간 계단이 나오게 해줘. 금 간 계단을 밟으면 0.5초 뒤에 무너지니까 바로 다음 칸으로 올라가야 해."},{"title":"난이도 조절하기","prompt":"처음 하는 친구도 오래 버틸 수 있게 시간 막대가 더 천천히 줄어들게 하고, 계단이 꺾이는 횟수도 조금 줄여줘."},{"title":"새 친구 펫 만들기","prompt":"함께 오르는 친구에 강아지를 추가해줘. 코인 120개로 열고, 강아지와 함께면 100계단 보너스 시간이 두 배가 되게 해줘."},{"title":"피버 타임 더하기","prompt":"30계단을 실수 없이 빠르게 오르면 5초 동안 피버 타임이 되게 해줘. 피버 중에는 계단이 반짝이고 코인이 두 배로 나와."}]}</script>
<script defer src="maker-guide.js"></script>
<!-- maker-guide:end -->
</body></html>
