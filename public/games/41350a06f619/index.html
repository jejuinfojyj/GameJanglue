<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>레일 서퍼</title><link rel="stylesheet" href="game-shell.css"><link rel="stylesheet" href="main.css"><script type="module" src="main.js"></script></head>
<body><main id="game-frame"><header id="game-toolbar"><span data-game-title>레일 서퍼</span><div class="toolbar-actions"><button type="button" id="sound-toggle" aria-pressed="true">소리 켬 🔊</button><button type="button" id="pause-game" hidden>쉬기 ⏸</button></div></header><canvas id="game-canvas" width="480" height="800" aria-label="게임 화면"></canvas>
<section id="round-overlay"><div class="round-sheet"><h1 id="round-heading" data-game-title>레일 서퍼</h1><p id="round-description"></p><p id="game-help"></p><p id="record-line"></p><div id="shop" class="shop"><h2 class="shop-title">달릴 친구</h2><div id="hero-list" class="chip-row"></div><h2 class="shop-title">호버보드</h2><div id="board-list" class="chip-row"></div></div><div class="round-buttons"><button id="round-primary" type="button">게임 시작</button><button id="round-restart" type="button" hidden>처음부터</button></div><div class="platform-row"><span id="game-credit"></span><button id="install-app" type="button">내 기기에 아이콘 추가</button><span id="offline-status" role="status"></span><button id="update-game" type="button" hidden>새 버전 적용</button></div></div></section></main>
<dialog id="install-help" aria-labelledby="install-help-title"><h2 id="install-help-title">게임 아이콘 추가하기</h2><p id="install-instructions">이 화면은 기본 게임 미리보기야. 나만의 게임을 완성하고 공개하면 내 기기에 아이콘을 추가할 수 있어!</p><button id="close-install-help" type="button">닫기</button></dialog>
<script defer src="game-install.js"></script>
<!-- maker-guide:start -->
<link rel="stylesheet" href="maker-guide.css">
<script id="maker-guide-data" type="application/json">{"examples":[{"title":"내 그림으로 주인공 바꾸기","prompt":"첨부한 그림을 source/assets/hero.png로 넣고 config.mjs의 ART.hero에 연결해서 주인공이 이 그림으로 달리게 해줘. 구를 때는 납작하게 줄여 줘."},{"title":"새 도시 추가하기","prompt":"월드 투어에 '부산' 도시를 추가해줘. 바다가 보이는 파란 하늘, 모래색 땅, 하얀 기차로 하고 랜드마크는 광안대교 모양으로 그려줘."},{"title":"새 친구 캐릭터 열기","prompt":"config.mjs의 HEROES에 빨간 헬멧을 쓴 '도윤'을 추가해줘. 코인 300개로 열 수 있고, 도윤으로 달리면 점프가 조금 더 높았으면 좋겠어."},{"title":"새 아이템: 코인 비","prompt":"먹으면 5초 동안 세 레인 모두에 코인이 줄지어 나타나는 '코인 비' 아이템을 추가해줘. 아이템 색은 금색으로 하고 남은 시간 막대도 보이게 해줘."},{"title":"새 장애물: 굴러오는 짐수레","prompt":"300m가 넘으면 레인을 따라 천천히 굴러오는 짐수레 장애물이 나오게 해줘. 높이가 낮아서 점프로 넘을 수 있고, 부딪히면 끝나."},{"title":"처음 하는 친구용 쉬운 모드","prompt":"처음 하는 친구도 오래 달릴 수 있게 출발 속도를 11로 낮추고 빨라지는 속도도 절반으로 줄여줘. 판마다 주는 호버보드도 3개로 늘려줘."},{"title":"미션 도전 추가하기","prompt":"판마다 '코인 50개 모으기', '차단봉 10번 넘기', '500m 달리기' 중 하나를 미션으로 보여 주고, 성공하면 결과 화면에서 보너스 코인 100개를 줘."},{"title":"조작을 버튼으로 바꾸기","prompt":"스와이프가 어려운 친구를 위해 화면 아래에 ←, ↑, ↓, → 버튼을 크게 놓고 누르면 레인 이동, 점프, 구르기가 되게 해줘. 스와이프도 계속 쓸 수 있게 해줘."}]}</script>
<script defer src="maker-guide.js"></script>
<!-- maker-guide:end -->
</body></html>
