<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>새총 요새 대작전</title><link rel="stylesheet" href="game-shell.css"><link rel="stylesheet" href="main.css"><script type="module" src="main.js"></script></head>
<body><main id="game-frame"><header id="game-toolbar"><span data-game-title>새총 요새 대작전</span><button type="button" id="pause-game" hidden>쉬기 ⏸</button></header><canvas id="game-canvas" width="960" height="540" aria-label="새총 요새 대작전 게임 화면"></canvas>
<section id="round-overlay"><div class="round-sheet"><h1 id="round-heading" data-game-title>새총 요새 대작전</h1><p id="round-description"></p><p id="game-help"></p><div class="round-buttons"><button id="round-primary" type="button">게임 시작</button><button id="round-restart" type="button" hidden>처음부터</button></div><div class="platform-row"><span id="game-credit"></span><button id="install-app" type="button">내 기기에 아이콘 추가</button><span id="offline-status" role="status"></span><button id="update-game" type="button" hidden>새 버전 적용</button></div></div></section></main>
<p class="rotate-hint">휴대폰을 가로로 돌리면 요새가 더 크게 보여!</p>
<dialog id="install-help" aria-labelledby="install-help-title"><h2 id="install-help-title">게임 아이콘 추가하기</h2><p id="install-instructions">이 화면은 기본 게임 미리보기야. 나만의 게임을 완성하고 공개하면 내 기기에 아이콘을 추가할 수 있어!</p><button id="close-install-help" type="button">닫기</button></dialog>
<script defer src="game-install.js"></script>
<!-- maker-guide:start -->
<link rel="stylesheet" href="maker-guide.css">
<script id="maker-guide-data" type="application/json">{"examples":[{"title":"내 새 캐릭터 만들기","prompt":"빨간 불끈이를 내가 좋아하는 동물로 바꿔줘. 이름은 '용용이'로 하고, 날아갈 때 화면을 톡 누르면 불꽃을 뿜어서 나무 블록을 잘 태우게 해줘."},{"title":"돼지 대신 다른 악당","prompt":"초록 돼지를 장난꾸러기 외계인으로 바꾸고, 하늘 배경도 보라색 우주와 별로 바꿔줘. 외계인이 없어질 때 반짝이 효과가 나오게 해줘."},{"title":"새 재질 블록 추가","prompt":"통통 튀는 젤리 블록을 새로 만들어줘. 새가 부딪히면 트램펄린처럼 세게 튕겨 나가고, 폭발에는 약하게 해줘. 2단계 요새에 젤리 블록을 몇 개 넣어줘."},{"title":"4단계 요새 만들기","prompt":"4단계 '구름 위 성'을 추가해줘. 공중에 떠 있는 돌판 위에 돼지 5마리를 두고, 쾅쾅이와 알뿅이를 두 마리씩 줘."},{"title":"보너스 아이템","prompt":"요새 곳곳에 황금 알을 숨겨줘. 새로 황금 알을 맞히면 3000점 보너스와 함께 반짝이는 효과가 나오게 해줘."},{"title":"바람 규칙 더하기","prompt":"단계마다 바람이 불게 해줘. 화면 위에 바람 방향 화살표를 보여 주고, 날아가는 새가 바람 쪽으로 조금씩 밀리게 해줘."},{"title":"내 그림으로 바꾸기","prompt":"첨부한 내 그림을 첫 번째 새로 써줘. 그림은 source/assets 폴더에 넣고 config.mjs의 IMAGES에 연결해줘."}]}</script>
<script defer src="maker-guide.js"></script>
<!-- maker-guide:end -->
</body></html>
